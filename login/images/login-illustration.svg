<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.16"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Elements -->
  <ellipse cx="180" cy="85" rx="140" ry="45" fill="#2563eb" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Left: Open Academic Book (Isometric angled) -->
  <g transform="translate(42, 60)" filter="url(#softShadow)">
    <!-- Book Base / Cover -->
    <path d="M4 38 Q 45 48 85 36 Q 125 48 166 38 L166 46 Q 125 56 85 44 Q 45 56 4 46 Z" fill="#1e3a8a"/>
    <!-- Left Page -->
    <path d="M6 36 Q 45 22 85 34 L85 4 Q 45 -8 6 4 Z" fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="0.8"/>
    <!-- Right Page -->
    <path d="M85 34 Q 125 22 164 36 L164 4 Q 125 -8 85 4 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <!-- Center Spine Ribbon -->
    <path d="M85 4 L85 44 L90 52 L85 48 L80 52 L85 44 Z" fill="url(#goldGrad)"/>
    <!-- Page text lines Left -->
    <line x1="20" y1="10" x2="70" y2="10" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="16" x2="65" y2="16" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="22" x2="72" y2="22" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Page text lines Right -->
    <line x1="100" y1="10" x2="150" y2="10" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="100" y1="16" x2="140" y2="16" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="100" y1="22" x2="146" y2="22" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Center-Right: Modern Floating Campus Device with Analytics Graph -->
  <g transform="translate(160, 10)" filter="url(#softShadow)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="130" height="98" rx="14" fill="url(#bodyGrad)" stroke="#334155" stroke-width="1.5"/>
    <!-- Device Screen -->
    <rect x="5" y="5" width="120" height="88" rx="10" fill="#ffffff"/>

    <!-- Screen Header Bar -->
    <rect x="5" y="5" width="120" height="20" rx="8" fill="url(#screenGrad)"/>
    <!-- Camera Dot -->
    <circle cx="65" cy="10" r="1.5" fill="#ffffff" opacity="0.8"/>
    <!-- Header Mini Title -->
    <text x="14" y="19" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" letter-spacing="0.4">VidyaOS Analytics</text>
    <!-- Mini Live Status Badge -->
    <circle cx="112" cy="15" r="2.5" fill="#34d399"/>

    <!-- Inside Screen: Bar Chart (Attendance & Performance Graph) -->
    <g transform="translate(14, 32)">
      <!-- Chart Baseline -->
      <line x1="0" y1="52" x2="102" y2="52" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="36" x2="102" y2="36" stroke="#f1f5f9" stroke-width="0.8" stroke-dasharray="2,2"/>
      <line x1="0" y1="20" x2="102" y2="20" stroke="#f1f5f9" stroke-width="0.8" stroke-dasharray="2,2"/>

      <!-- Rising Bars with Rounded Tops -->
      <rect x="6" y="28" width="9" height="24" rx="2.5" fill="url(#barGrad1)"/>
      <rect x="22" y="18" width="9" height="34" rx="2.5" fill="url(#barGrad1)"/>
      <rect x="38" y="22" width="9" height="30" rx="2.5" fill="url(#barGrad1)"/>
      <rect x="54" y="12" width="9" height="40" rx="2.5" fill="url(#barGrad1)"/>
      <rect x="70" y="8" width="9" height="44" rx="2.5" fill="url(#barGrad2)"/>
      <rect x="86" y="15" width="9" height="37" rx="2.5" fill="url(#barGrad1)"/>

      <!-- Trendline overlay with dots -->
      <path d="M10 28 L26 18 L42 22 L58 12 L74 8 L90 15" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="58" cy="12" r="2" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="74" cy="8" r="2.5" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Top-Left Floating Graduation Cap (Scholar / Academic Identity) -->
  <g transform="translate(70, 8)" filter="url(#softShadow)">
    <!-- Cap Diamond -->
    <polygon points="38,2 74,15 38,28 2,15" fill="#1e293b"/>
    <polygon points="38,2 74,15 38,25 2,15" fill="#2563eb" opacity="0.3"/>
    <polygon points="38,5 70,15 38,24 6,15" fill="#0f172a"/>
    <!-- Cap Skull Base -->
    <path d="M18 21 L18 31 C18 37 58 37 58 31 L58 21 C50 25 26 25 18 21 Z" fill="#0f172a"/>
    <!-- Golden Button & Tassel -->
    <circle cx="38" cy="15" r="2.5" fill="url(#goldGrad)"/>
    <path d="M38 15 Q 54 20 56 32 L54 44 L58 44 L56 32" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <polygon points="53,42 59,42 58,47 54,47" fill="url(#goldGrad)"/>
  </g>

  <!-- Floating Mini KPI Badge 1 (Verified 100% Attendance) -->
  <g transform="translate(18, 20)" filter="url(#softShadow)">
    <rect x="0" y="0" width="46" height="26" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="12" cy="13" r="6" fill="#eff6ff"/>
    <path d="M9 13 l2 2 l4 -4" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="16" font-family="'Inter', sans-serif" font-size="8" font-weight="750" fill="#0f172a">100%</text>
  </g>

  <!-- Floating Mini KPI Badge 2 (Live Campus Sync) -->
  <g transform="translate(296, 68)" filter="url(#softShadow)">
    <rect x="0" y="0" width="52" height="26" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="12" cy="13" r="6" fill="#f0fdf4"/>
    <path d="M9 13 l2 2 l4 -4" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="21" y="16" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#16a34a">SYNC</text>
  </g>

  <!-- Decorative Sparkle Stars -->
  <path d="M148 18 L150 22 L154 24 L150 26 L148 30 L146 26 L142 24 L146 22 Z" fill="#f59e0b" opacity="0.8"/>
  <path d="M320 28 L321 31 L324 32 L321 33 L320 36 L319 33 L316 32 L319 31 Z" fill="#60a5fa" opacity="0.9"/>
</svg>