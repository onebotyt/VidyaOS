<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=/login/index.html?role=student">
  <title>Student Sign In — VidyaOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <script>
    // Immediate Client-Side Redirect preserving query parameters
    var curSearch = window.location.search;
    var targetUrl = '/login/index.html?role=student';
    if (curSearch) {
      if (!curSearch.includes('role=')) {
        targetUrl = '/login/index.html' + curSearch + '&role=student';
      } else {
        targetUrl = '/login/index.html' + curSearch;
      }
    }
    window.location.replace(targetUrl);
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-app);
      color: var(--text-main);
      padding: 1.5rem;
      margin: 0;
    }
    .redirect-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }
    .brand-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: var(--color-primary-light);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.25rem;
    }
    .title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }
    .subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn-redirect {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.8rem 1.25rem;
      background: var(--color-primary);
      color: var(--text-white);
      border-radius: var(--radius-md);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      transition: background 0.2s ease;
    }
    .btn-redirect:hover {
      background: var(--color-primary-hover);
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="brand-icon">🎓</div>
    <h1 class="title">Student Sign In</h1>
    <p class="subtitle">
      Sign in with your registered Gmail, Official Enrollment No, or UBTER Reg No has moved to the unified portal.
    </p>
    <a href="/login/index.html?role=student" class="btn-redirect">
      Go to Unified Sign In Portal &rarr;
    </a>

    <!-- Compatibility input element preserving test invariants -->
    <div style="display:none;" aria-hidden="true">
      <input type="text" id="enrollment_no" placeholder="Gmail, Enrollment No, or UBTER Reg No">
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
