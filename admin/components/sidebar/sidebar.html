<!-- 1. MOBILE TOP HEADER (Visible on mobile <= 768px only; hidden on desktop) -->
<header class="mobile-top-header" id="mobile-top-header">
  <div class="mobile-header-left">
    <button type="button" class="mobile-hamburger-btn" id="mobile-sidebar-toggle-btn" onclick="toggleSidebar()"
      aria-label="Open Navigation Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="mobile-header-center">
    <a href="/admin/dashboard.html" class="mobile-brand-link">
      <span class="mobile-brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 21h18M3 10h18M5 10v11M19 10v11M9 10v11M15 10v11M12 2L2 7h20L12 2z"></path>
        </svg>
      </span>
      <span class="mobile-brand-text">VidyaOS</span>
    </a>
  </div>

  <div class="mobile-header-right">
    <button type="button" class="mobile-header-icon-btn mobile-bell-btn" onclick="toggleNotifications(event)"
      aria-label="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="mobile-bell-badge">1</span>
    </button>
  </div>
</header>
