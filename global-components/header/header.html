<!--
  ══════════════════════════════════════════════════════════════
  VIDYAOS ADMIN TOP HEADER COMPONENT (header.html)
  Location: /admin/components/header/header.html
  100% Theme Tokenized — Zero Hardcoded Hex Colors
  Clean, Minimalist: Theme Toggle + Round Profile Avatar
  ══════════════════════════════════════════════════════════════
-->
<header class="admin-top-header" id="admin-top-header" aria-label="Admin Header Bar">
  <!-- Left Header: Mobile hamburger (mobile only) + Logo + Brand Title -->
  <div class="header-left">
    <button type="button" class="header-mobile-toggle-btn" id="admin-mobile-nav-toggle" onclick="if(typeof toggleSidebar==='function')toggleSidebar()" aria-label="Toggle Navigation Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <a href="/admin/dashboard/index.html" class="header-brand-link" aria-label="VidyaOS Dashboard">
      <span class="header-brand-logo">
        <svg class="header-brand-cube" width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M16 3.5L27.5 9.8L16 16.2L4.5 9.8L16 3.5Z" fill="var(--color-primary-light, hsl(215 90% 95%))" stroke="var(--color-primary)" stroke-width="1.2" stroke-linejoin="round"/><path d="M4.5 9.8L16 16.2V28.5L4.5 22.2V9.8Z" fill="var(--color-primary, hsl(217 91% 60%))" stroke="var(--color-primary-hover)" stroke-width="1.2" stroke-linejoin="round"/><path d="M16 16.2L27.5 9.8V22.2L16 28.5V16.2Z" fill="var(--color-primary-hover, hsl(224 76% 48%))" stroke="var(--color-primary-hover)" stroke-width="1.2" stroke-linejoin="round"/><path d="M16 16.5V27.5" stroke="hsl(0 0% 100% / 0.4)" stroke-width="1.2" stroke-linecap="round"/><path d="M16.5 16L26.5 10.5" stroke="hsl(0 0% 100% / 0.3)" stroke-width="1.2" stroke-linecap="round"/></svg>
      </span>
      <div class="header-brand-info">
        <span class="header-brand-title">VidyaOS</span>
        <span class="header-brand-badge">Console</span>
      </div>
    </a>
  </div>

  <!-- Right Header Controls: Theme Toggle + Round Profile Avatar -->
  <div class="header-right">
    <!-- Theme Toggle (Light / Dark) -->
    <button type="button" class="header-icon-btn header-theme-toggle" id="theme-toggle-btn"
      onclick="toggleDashboardTheme()" title="Toggle Dark/Light Mode" aria-label="Toggle Dark/Light Mode">
      <svg class="icon-theme" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <!-- Round Profile Avatar Trigger -->
    <button type="button" class="header-profile-round-btn" id="header-user-profile"
      onclick="toggleAdminProfileMenu(event)" aria-haspopup="true" aria-expanded="false"
      title="System Administrator Profile" aria-label="Open User Profile Menu">
      <span class="user-avatar-initials" id="header-user-initials">SA</span>
      <span class="avatar-online-dot"></span>
    </button>

    <!-- Dropdown Profile Menu -->
    <div class="header-profile-dropdown" id="header-profile-dropdown" aria-hidden="true">
      <div class="profile-dropdown-user-card">
        <div class="dropdown-avatar-circle" aria-hidden="true">SA</div>
        <div class="dropdown-user-meta">
          <span class="dropdown-full-name">System Administrator</span>
          <span class="dropdown-email">admin@college.edu</span>
        </div>
      </div>
      <div class="profile-dropdown-divider"></div>
      <a href="/admin/profile/index.html" class="profile-dropdown-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>My Profile</span>
      </a>
      <a href="/admin/settings/index.html" class="profile-dropdown-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
        <span>System Settings</span>
      </a>
      <a href="/admin/audit-logs/index.html" class="profile-dropdown-item">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>Audit Trail &amp; Logs</span>
      </a>
      <div class="profile-dropdown-divider"></div>
      <button type="button" class="profile-dropdown-item dropdown-logout-btn" onclick="if(typeof confirmAdminLogout==='function'){confirmAdminLogout();}else if(typeof adminLogout==='function'){adminLogout();}else if(typeof logout==='function'){logout();}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Sign Out</span>
      </button>
    </div>
  </div>
</header>
