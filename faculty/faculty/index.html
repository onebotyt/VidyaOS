<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Faculty Management — VidyaOS</title>
  <meta name="description" content="Manage teaching faculty, appoint Heads of Department, and monitor departmental leadership.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/faculty/components/core/reset.css">
  <link rel="stylesheet" href="/faculty/components/core/variables.css">
  <link rel="stylesheet" href="/faculty/components/faculty-base.css?v=20261117">
  <link rel="stylesheet" href="/faculty/components/header/header.css?v=20261117">
  <link rel="stylesheet" href="/faculty/components/sidebar/sidebar.css?v=20261117">
  <link rel="stylesheet" href="/global-components/roster-filter/roster-filter.css?v=20261122">
  <link rel="stylesheet" href="/global-components/confirm-modal/confirm-modal.css?v=20261122">
  <link rel="stylesheet" href="/global-components/profile-modal/profile-modal.css?v=20261122">
  <link rel="stylesheet" href="/faculty/faculty/faculty.css?v=20261122_08">
  <script>
    (function () {
      try {
        if (window.innerWidth >= 769) {
          document.documentElement.classList.add('sidebar-collapsed');
        }
      } catch (_) { }
    })();
  </script>
</head>

<body class="page-layout">

  <div class="faculty-app-layout" id="faculty-app-layout">
    <div class="faculty-main-wrap">
      <!-- Semantic Mount for Dedicated Faculty Header Component -->
      <div id="faculty-header-mount"></div>

      <main class="fac-container" style="padding-top: 0.4rem; padding-bottom: 5rem;">
        <!-- ══════════════════════════════════════════════════════════════ -->
        <!-- 1. HEADLINE, BACK BUTTON & ACTION TOOLBAR                      -->
        <!-- ══════════════════════════════════════════════════════════════ -->
        <section class="fac-header-toolbar" aria-label="Faculty Management Header">
          <div class="fac-header-left">
            <button type="button" class="btn btn-secondary btn-sm fac-back-btn"
              onclick="window.history.length > 1 ? window.history.back() : window.location.href='/faculty/dashboard/index.html'"
              title="Go Back">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
              <span>Back</span>
            </button>
            <div class="fac-header-titles">
              <h1 class="fac-page-headline">Faculty Management</h1>
              <p class="fac-page-subtext">Manage teaching faculty, appoint Heads of Department, and monitor departmental...</p>
            </div>
          </div>
          <div class="fac-header-right">
            <button type="button" class="btn btn-secondary btn-sm fac-trash-trigger-btn" id="pill-trash"
              onclick="switchToTrashTab()" title="View soft-deleted faculty (30-day retention)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              <span>Trash</span>
              <span class="fac-trash-badge" id="kpi-trash-count">0</span>
            </button>
            <button type="button" class="btn btn-secondary btn-sm fac-assign-hod-main-btn" id="btn-open-search-hod"
              onclick="filterByHodOnly()" title="Filter HOD faculty">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <polyline points="16 11 18 13 22 9"></polyline>
              </svg>
              <span class="fac-btn-label-full">HOD</span>
              <span class="fac-btn-label-short">HOD</span>
            </button>
            <button type="button" class="btn btn-primary btn-sm fac-create-btn" id="create-faculty-btn"
              onclick="openAddFacultyModal()" title="Add New Faculty">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span class="fac-btn-label-full">Add Faculty</span>
              <span class="fac-btn-label-short">+ Add</span>
            </button>
          </div>
        </section>

        <!-- ══════════════════════════════════════════════════════════════ -->
        <!-- 2. DIRECTORY WORKSPACE (GLOBAL ROSTER FILTER)                  -->
        <!-- ══════════════════════════════════════════════════════════════ -->
        <div id="fac-directory-workspace">
          <section class="global-roster-section" id="fac-roster-section" aria-label="Faculty Directory">
            <!-- Initialized dynamically by GlobalRosterFilter -->
          </section>
        </div>

        <!-- ══════════════════════════════════════════════════════════════ -->
        <!-- HIDDEN COMPATIBILITY MARKERS (Preserves Test Contracts)        -->
        <!-- ══════════════════════════════════════════════════════════════ -->
        <div style="display:none;" aria-hidden="true">
          <span id="stat-total-faculty">0</span>
          <span id="stat-active-faculty">0</span>
          <span id="stat-active-teachers">0</span>
          <span id="stat-teachers-sub">Teaching &amp; Curriculum Ready</span>
          <span id="badge-count-all">0</span>
          <span id="badge-count-trash">0</span>
          <span id="header-trash-count">0</span>
          <input type="search" id="faculty-search" />
        </div>
      </main>
    </div>
  </div>

  <!-- Modal: Add New Faculty -->
  <div id="modal-add-faculty" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100100; align-items:center; justify-content:center; padding:1rem;" onclick="if(event.target===this)closeAddFacultyModal()">
    <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:16px; width:100%; max-width:480px; box-shadow:0 16px 36px rgba(0,0,0,0.2); overflow:hidden;">
      <div style="padding:1rem 1.25rem; border-bottom:1px solid var(--border-color); display:flex; align-items:center; justify-content:space-between;">
        <strong style="font-size:1.05rem; color:var(--text-main);">+ Add Department Faculty</strong>
        <button type="button" onclick="closeAddFacultyModal()" style="background:none; border:none; font-size:1.4rem; cursor:pointer; color:var(--text-muted);">&times;</button>
      </div>
      <form id="form-add-faculty" style="padding:1.25rem; display:flex; flex-direction:column; gap:0.75rem;">
        <div>
          <label style="display:block; font-size:0.76rem; font-weight:700; color:var(--text-main); margin-bottom:0.25rem;">Full Name *</label>
          <input type="text" id="add-fac-name" required placeholder="e.g. Prof. Amit Verma" style="width:100%; padding:0.55rem 0.75rem; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-surface); color:var(--text-main); font-size:0.86rem; box-sizing:border-box;">
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.65rem;">
          <div>
            <label style="display:block; font-size:0.76rem; font-weight:700; color:var(--text-main); margin-bottom:0.25rem;">Employee ID *</label>
            <input type="text" id="add-fac-empid" required placeholder="IT-T-02" style="width:100%; padding:0.55rem 0.75rem; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-surface); color:var(--text-main); font-size:0.86rem; box-sizing:border-box; font-family:var(--font-family-mono);">
          </div>
          <div>
            <label style="display:block; font-size:0.76rem; font-weight:700; color:var(--text-main); margin-bottom:0.25rem;">Phone Number</label>
            <input type="tel" id="add-fac-phone" placeholder="9876543210" style="width:100%; padding:0.55rem 0.75rem; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-surface); color:var(--text-main); font-size:0.86rem; box-sizing:border-box;">
          </div>
        </div>
        <div>
          <label style="display:block; font-size:0.76rem; font-weight:700; color:var(--text-main); margin-bottom:0.25rem;">Email Address *</label>
          <input type="email" id="add-fac-email" required placeholder="faculty@college.edu" style="width:100%; padding:0.55rem 0.75rem; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-surface); color:var(--text-main); font-size:0.86rem; box-sizing:border-box;">
        </div>
        <div>
          <label style="display:block; font-size:0.76rem; font-weight:700; color:var(--text-main); margin-bottom:0.25rem;">Initial Password</label>
          <input type="password" id="add-fac-pass" value="Welcome@123" style="width:100%; padding:0.55rem 0.75rem; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-surface); color:var(--text-main); font-size:0.86rem; box-sizing:border-box;">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:0.65rem; margin-top:0.5rem;">
          <button type="button" onclick="closeAddFacultyModal()" style="padding:0.55rem 1rem; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-surface); color:var(--text-main); font-size:0.82rem; cursor:pointer;">Cancel</button>
          <button type="submit" style="padding:0.55rem 1.25rem; border-radius:8px; border:none; background:var(--color-primary); color:var(--text-white, #ffffff); font-size:0.82rem; font-weight:700; cursor:pointer;">Onboard Faculty</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DYNAMIC GLOBAL PROFILE MODAL (Managed by /global-components/profile-modal/profile-modal.js) -->

  <!-- Shared Notification Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Core Scripts -->
  <script src="/faculty/components/core/api.js"></script>
  <script src="/faculty/components/core/auth.js"></script>
  <script src="/faculty/components/icons.js?v=20261117"></script>
  <script src="/global-components/roster-filter/roster-filter.js?v=20261122"></script>
  <script src="/global-components/confirm-modal/confirm-modal.js?v=20261122"></script>
  <script src="/global-components/profile-modal/profile-modal.js?v=20261122"></script>
  <script src="/faculty/components/sidebar/sidebar.js?v=20261117"></script>
  <script src="/faculty/components/header/header.js?v=20261117"></script>
  <script src="/faculty/components/faculty-ui.js"></script>
  <script src="/faculty/faculty/faculty.js?v=20261122_08"></script>
</body>

</html>
