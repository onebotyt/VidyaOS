<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Timetable Management — VidyaOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/faculty/components/core/reset.css">
  <link rel="stylesheet" href="/faculty/components/core/variables.css">
  <link rel="stylesheet" href="/faculty/components/faculty-base.css?v=20261116">
  <link rel="stylesheet" href="/faculty/components/header/header.css?v=20261116">
  <link rel="stylesheet" href="/faculty/components/sidebar/sidebar.css?v=20261116">
  <link rel="stylesheet" href="/faculty/components/dept-hero/dept-hero.css?v=20261116">
  <link rel="stylesheet" href="/faculty/timetable/timetable.css?v=20261116">
  <script>
    (function () {
      try {
        if (window.innerWidth >= 769) {
          document.documentElement.classList.add('sidebar-collapsed');
        }
      } catch (_) { }
    })();
  </script>
</head>

<body class="page-layout">

  <div class="faculty-app-layout" id="faculty-app-layout">
    <div class="faculty-main-wrap">
      <!-- Semantic Mount for Dedicated Faculty Header Component -->
      <div id="faculty-header-mount"></div>

      <main class="page-main-container container timetable-container">
        <!-- Reusable Institutional Hero Banner -->
        <div id="dept-hero-container" class="dept-hero-mount" data-title="Academic Timetable" data-subtitle="Upload and manage official academic timetables by year for student access."></div>

        <!-- Page Action Row -->
        <div class="tt-page-header">
          <div class="tt-header-left">
            <div class="tt-header-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </div>
            <div>
              <h1 class="tt-page-title">Branch Timetables (PDF)</h1>
              <p class="tt-page-subtitle">Select year to upload or view official academic routine.</p>
            </div>
          </div>
          <div class="tt-header-actions">
            <button type="button" class="btn btn-primary" onclick="openUploadTimetableModal()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span>+ Upload Timetable PDF</span>
            </button>
          </div>
        </div>

        <!-- Year Filter Pill Bar -->
        <nav class="tt-year-nav" aria-label="Filter Timetable by Year">
          <button type="button" class="tt-year-pill active" data-year="ALL" onclick="filterTimetableByYear('ALL')">
            <span>All Years</span>
            <span class="tt-year-count-badge" id="badge-count-all">0</span>
          </button>
          <button type="button" class="tt-year-pill" data-year="1" onclick="filterTimetableByYear(1)">
            <span>1st Year</span>
            <span class="tt-year-count-badge" id="badge-count-1">0</span>
          </button>
          <button type="button" class="tt-year-pill" data-year="2" onclick="filterTimetableByYear(2)">
            <span>2nd Year</span>
            <span class="tt-year-count-badge" id="badge-count-2">0</span>
          </button>
          <button type="button" class="tt-year-pill" data-year="3" onclick="filterTimetableByYear(3)">
            <span>3rd Year</span>
            <span class="tt-year-count-badge" id="badge-count-3">0</span>
          </button>
          <button type="button" class="tt-year-pill" data-year="4" onclick="filterTimetableByYear(4)">
            <span>4th Year</span>
            <span class="tt-year-count-badge" id="badge-count-4">0</span>
          </button>
        </nav>

        <!-- Timetable Cards Container -->
        <div id="timetable-cards-container" class="tt-cards-grid">
          <!-- Populated dynamically via JS -->
          <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);">
            Loading academic timetables...
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal: Upload Timetable PDF -->
  <div id="modal-upload-timetable" class="tt-modal-backdrop" onclick="if(event.target===this)closeUploadTimetableModal()">
    <div class="tt-modal-card">
      <div class="tt-modal-header">
        <h3 class="tt-modal-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
          <span>Upload Academic Timetable PDF</span>
        </h3>
        <button type="button" class="tt-modal-close-btn" onclick="closeUploadTimetableModal()">&times;</button>
      </div>
      <form id="form-upload-timetable" onsubmit="submitTimetablePdf(event)">
        <div class="tt-modal-body">
          <div class="tt-form-group">
            <label class="tt-form-label" for="tt-upload-year">Target Academic Year *</label>
            <select id="tt-upload-year" class="tt-form-select" required onchange="onUploadYearChange()">
              <option value="" disabled selected>-- Select Academic Year --</option>
              <option value="1">1st Year (Semester 1 & 2)</option>
              <option value="2">2nd Year (Semester 3 & 4)</option>
              <option value="3">3rd Year (Semester 5 & 6)</option>
              <option value="4">4th Year (Semester 7 & 8)</option>
            </select>
          </div>

          <div class="tt-form-group">
            <label class="tt-form-label" for="tt-upload-title">Timetable Title / Label (Optional)</label>
            <input type="text" id="tt-upload-title" class="tt-form-input" placeholder="e.g. Odd Semester 2026-27 Master Timetable">
          </div>

          <div class="tt-form-group">
            <label class="tt-form-label">Timetable PDF File *</label>
            <div class="tt-dropzone" id="tt-dropzone">
              <svg class="tt-dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <path d="M12 18v-6"></path>
                <path d="m9 15 3-3 3 3"></path>
              </svg>
              <div class="tt-dropzone-text">Click to choose or drag &amp; drop PDF file</div>
              <div class="tt-dropzone-hint">Strictly PDF files only (up to 50 MB)</div>
              <input type="file" id="tt-file-input" accept=".pdf,application/pdf" required onchange="handleFileSelect(this)">
            </div>

            <div class="tt-selected-file-info" id="tt-selected-file-info">
              <span id="tt-file-name-label">filename.pdf</span>
              <span id="tt-file-size-label" style="color:var(--text-muted); font-size:0.75rem;">(0 KB)</span>
            </div>
          </div>
        </div>

        <div class="tt-modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeUploadTimetableModal()">Cancel</button>
          <button type="submit" id="btn-submit-upload" class="btn btn-primary">
            <span>Upload Timetable</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Embedded PDF Viewer -->
  <div id="modal-pdf-viewer" class="tt-modal-backdrop" onclick="if(event.target===this)closePdfViewerModal()">
    <div class="tt-modal-card tt-viewer-card">
      <div class="tt-modal-header">
        <h3 class="tt-modal-title" id="viewer-title">Academic Timetable Preview</h3>
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <a id="viewer-external-link" href="#" target="_blank" class="btn btn-secondary btn-sm" title="Open in new window">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            <span>Open Tab</span>
          </a>
          <button type="button" class="tt-modal-close-btn" onclick="closePdfViewerModal()">&times;</button>
        </div>
      </div>
      <iframe id="pdf-viewer-frame" class="tt-viewer-frame" src="about:blank"></iframe>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="/faculty/components/core/api.js"></script>
  <script src="/faculty/components/core/auth.js"></script>
  <script src="/faculty/components/icons.js?v=20261116"></script>
  <script src="/faculty/components/sidebar/sidebar.js?v=20261116"></script>
  <script src="/faculty/components/header/header.js?v=20261116"></script>
  <script src="/faculty/components/dept-hero/dept-hero.js?v=20261116"></script>
  <script src="/faculty/timetable/timetable.js?v=20261116"></script>
</body>

</html>
