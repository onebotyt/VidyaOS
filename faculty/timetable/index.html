<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timetable — Faculty Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css?v=20261028">
  <link rel="stylesheet" href="/css/variables.css?v=20261028">
  <link rel="stylesheet" href="/faculty/components/faculty-base.css?v=20261029">
  <link rel="stylesheet" href="/faculty/components/header/header.css?v=20261029">
  <link rel="stylesheet" href="/faculty/components/sidebar/sidebar.css?v=20261029">
  
  <link rel="stylesheet" href="/faculty/timetable/timetable.css?v=20261028">
  <script>
    /* Always start closed (72px collapsed mini-rail) when page opens */
    (function () {
      try {
        if (window.innerWidth >= 769) {
          document.documentElement.classList.add('sidebar-collapsed');
        }
      } catch (_) { }
    })();
  </script>
</head>
<body>
    
    <div class="faculty-app-layout" id="faculty-app-layout">
    <div class="faculty-main-wrap">
      <!-- Top Header Bar (Clean Admin-Parity Architecture) -->
      <header class="faculty-top-header admin-top-header" id="faculty-header" aria-label="Faculty Header Bar">
        <div class="header-left">
          <span class="header-dept-pill" id="dept-header-name" style="display:none;"></span>
        </div>
        <div class="header-right">
          <!-- Theme Toggle Button -->
          <button type="button" class="header-icon-btn header-theme-toggle" id="theme-toggle-btn" onclick="toggleAppTheme()" title="Toggle Dark/Light Mode" aria-label="Toggle Dark/Light Mode">
            <svg class="icon-theme" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <!-- Round User Profile Avatar Trigger -->
          <button type="button" class="header-profile-round-btn" id="header-user-profile" onclick="toggleUserProfile(event)" aria-haspopup="true" aria-expanded="false" title="Account Profile" aria-label="Open User Profile Menu">
            <span class="user-avatar-initials" id="header-user-initials">FA</span>
            <span class="avatar-online-dot"></span>
          </button>

          <!-- Dropdown Profile Menu -->
          <div class="header-profile-dropdown" id="header-profile-dropdown" aria-hidden="true">
            <div class="profile-dropdown-user-card">
              <div class="dropdown-avatar-circle" id="dropdown-avatar-circle" aria-hidden="true">FA</div>
              <div class="dropdown-user-meta">
                <span class="dropdown-full-name" id="dropdown-full-name">Faculty Member</span>
                <span class="dropdown-email" id="dropdown-email">faculty@college.edu</span>
                <span class="dropdown-role-pill" id="dropdown-role-pill">Faculty Member</span>
              </div>
            </div>
            <div class="profile-dropdown-divider"></div>
            <a href="/faculty/profile.html" class="profile-dropdown-item">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <span>My Profile</span>
            </a>
            <a href="/faculty/timetable.html" class="profile-dropdown-item">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span>Weekly Timetable</span>
            </a>
            <div class="profile-dropdown-divider"></div>
            <button type="button" class="profile-dropdown-item dropdown-logout-btn" onclick="logout()">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Sign Out</span>
            </button>
          </div>
        </div>
      </header>

  <main class="container" style="padding-top: 2rem; padding-bottom: 3rem; max-width: 1100px;">
    <div class="page-header">
      <div>
        <h1 class="page-title">Timetable</h1>
        <p class="page-subtitle">Pick a class, then view or add its weekly schedule.</p>
      </div>
      <a href="/faculty/dashboard.html" class="btn btn-secondary btn-sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Dashboard</a>
    </div>

    <div class="card" style="margin-bottom: 1.25rem;">
      <label style="font-size:0.85rem; font-weight:600;">Class</label>
      <select id="class-select" onchange="onClassChange()" style="width:100%; padding:0.6rem; margin-top:0.4rem; border-radius: var(--radius-sm); border:1px solid var(--border-color);">
        <option>Loading classes...</option>
      </select>
    </div>

    <div class="week-grid" id="week-grid"></div>

    <div class="card" style="margin-top: 1.5rem;">
      <h3 style="font-size:1rem; font-weight:700; margin-bottom:0.5rem;">Add a Class Slot</h3>
      <form class="add-form" onsubmit="addSlot(event)">
        <div>
          <label>Day</label>
          <select id="f-day" required>
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
            <option value="6">Saturday</option>
          </select>
        </div>
        <div><label>Start Time</label><input type="time" id="f-start" required></div>
        <div><label>End Time</label><input type="time" id="f-end" required></div>
        <div><label>Room (optional)</label><input type="text" id="f-room" placeholder="e.g. Lab 2"></div>
        <div><label>Type</label>
          <select id="f-type">
            <option value="THEORY">Theory</option>
            <option value="PRACTICAL">Practical</option>
          </select>
        </div>
        <div style="align-self:end;"><button class="btn btn-primary" type="submit" style="width:100%;">+ Add Slot</button></div>
      </form>
    </div>
  </main>
  <script src="/js/api.js?v=20261029"></script>
  <script src="/js/auth.js?v=20261029"></script>
  <script src="/faculty/components/icons.js?v=20261029"></script>
  <script src="/faculty/components/faculty-ui.js?v=20261029"></script>
  <script src="/faculty/components/header/header.js?v=20261029"></script>
  <script src="/faculty/components/sidebar/sidebar.js?v=20261029"></script>
  
      </div>
  </div>

  <script src="/faculty/timetable/timetable.js?v=20261028"></script>
</body>
</html>
