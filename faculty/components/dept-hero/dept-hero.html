<!--
  VIDYAOS UNIFIED INSTITUTIONAL HERO COMPONENT (dept-hero.html)
  Location: /faculty/components/dept-hero/dept-hero.html
  100% Theme Token Compliant — Zero Hardcoded Hex Colors
-->
<section class="dept-hero-component" aria-label="Institutional Campus Showcase & Faculty Command Header">
  <!-- Left Side: College Identity & Page Meta -->
  <div class="hero-left-col">
    <!-- College Circular Logo -->
    <div class="hero-logo-circle-wrap" aria-hidden="true">
      <img id="hero-inst-logo" src="/images/college-logo.svg" alt="College Logo" class="hero-inst-logo-img"
        onerror="this.onerror=null;this.src='/images/college-logo.svg';">
    </div>

    <!-- College Name & Subtitle -->
    <div class="hero-inst-text-block">
      <h2 class="hero-inst-name" id="hero-inst-name">Government Polytechnic Nainital</h2>
      <p class="hero-inst-tagline" id="hero-inst-tagline">Uttarakhand | Completely Adhered to NBA Guidelines</p>
    </div>

    <!-- Vertical Divider -->
    <div class="hero-vertical-divider" aria-hidden="true"></div>

    <!-- Page Title & Subtitle -->
    <div class="hero-page-text-block">
      <h1 class="hero-page-title" id="hero-page-title">Faculty Dashboard</h1>
      <p class="hero-page-subtitle" id="hero-page-subtitle">Manage your classes, attendance, students and more.</p>
    </div>
  </div>

  <!-- Right Side: Panoramic College Campus Building Photo -->
  <div class="hero-right-col" aria-hidden="true">
    <div class="hero-campus-photo-wrap">
      <img id="hero-campus-img" src="/admin/dashboard/campus-nainital.jpg" alt="Government Polytechnic Nainital Campus"
        class="hero-campus-photo" onerror="this.onerror=null;this.src='/images/campus-nainital.jpg';">
      <div class="hero-campus-photo-overlay"></div>
    </div>
  </div>
</section>
