<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Requests — Faculty Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .filter-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .filter-tab {
      padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid var(--border-color);
      background: var(--bg-card); cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-muted);
    }
    .filter-tab.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
    .leave-card {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
      padding: 1.1rem 1.3rem; border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      background: var(--bg-card); margin-bottom: 0.85rem; flex-wrap: wrap;
    }
    .leave-name { font-weight: 700; font-size: 1rem; }
    .leave-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.15rem; }
    .leave-reason { font-size: 0.9rem; margin-top: 0.5rem; }
    .leave-actions { display: flex; gap: 0.5rem; }
    .status-pill {
      font-size: 0.72rem; font-weight: 800; text-transform: uppercase; padding: 0.2rem 0.6rem; border-radius: 999px;
    }
    .status-pill.PENDING { background: var(--status-pending-bg); color: var(--status-pending); }
    .status-pill.APPROVED { background: var(--status-present-bg); color: var(--status-present); }
    .status-pill.REJECTED { background: var(--status-absent-bg); color: var(--status-absent); }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="/faculty/dashboard.html" class="brand">
      <span class="brand-badge" style="background: var(--color-primary);">FACULTY</span>
      <span>Leave Requests</span>
    </a>
    <div id="user-nav" class="user-nav"></div>
  </header>

  <main class="container" style="padding-top: 2rem; padding-bottom: 3rem; max-width: 900px;">
    <div class="page-header">
      <div>
        <h1 class="page-title">Leave Requests</h1>
        <p class="page-subtitle">Approve or reject student leave applications for your classes.</p>
      </div>
      <a href="/faculty/dashboard.html" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" data-status="PENDING" onclick="setFilter('PENDING')">Pending</button>
      <button class="filter-tab" data-status="APPROVED" onclick="setFilter('APPROVED')">Approved</button>
      <button class="filter-tab" data-status="REJECTED" onclick="setFilter('REJECTED')">Rejected</button>
      <button class="filter-tab" data-status="" onclick="setFilter('')">All</button>
    </div>

    <div id="leave-list">Loading...</div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js?v=2.2"></script>
  <script>
    guardRoute({ roles: ['TEACHER', 'SYSTEM_ADMIN'], requireClassTeacher: true });
    let currentFilter = 'PENDING';

    function setFilter(status) {
      currentFilter = status;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.status === status));
      loadLeaves();
    }

    async function loadLeaves() {
      const list = document.getElementById('leave-list');
      list.innerHTML = 'Loading...';
      try {
        const qs = currentFilter ? `?status=${currentFilter}` : '';
        const res = await fetchApi(`/leave${qs}`);
        if (!res.success || !res.data.length) {
          list.innerHTML = `<div class="card" style="text-align:center; padding:2rem; color:var(--text-muted);">No leave requests here.</div>`;
          return;
        }
        list.innerHTML = res.data.map(l => `
          <div class="leave-card">
            <div>
              <div class="leave-name">${l.student_name} <span class="leave-meta">(${l.official_enrollment_no})</span></div>
              <div class="leave-meta">${l.department_name} · Year ${l.year} Sem ${l.semester} — ${formatDate(l.from_date)} to ${formatDate(l.to_date)}</div>
              <div class="leave-reason">"${escapeHtml(l.reason)}"</div>
              <div style="margin-top:0.5rem;"><span class="status-pill ${l.status}">${l.status}</span></div>
              ${l.review_note ? `<div class="leave-meta" style="margin-top:0.3rem;">Note: ${escapeHtml(l.review_note)}</div>` : ''}
            </div>
            ${l.status === 'PENDING' ? `
              <div class="leave-actions">
                <button class="btn btn-success btn-sm" onclick="decide(${l.id}, 'APPROVED')">✅ Approve</button>
                <button class="btn btn-danger btn-sm" onclick="decide(${l.id}, 'REJECTED')">❌ Reject</button>
              </div>` : ''}
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="card" style="padding:1rem; color:var(--status-absent);">Could not load leave requests.</div>`;
      }
    }

    async function decide(id, decision) {
      let review_note = '';
      if (decision === 'REJECTED') {
        review_note = prompt('Optional: add a short reason for rejecting') || '';
      }
      try {
        const res = await fetchApi(`/leave/${id}/decision`, {
          method: 'PUT',
          body: JSON.stringify({ decision, review_note })
        });
        if (res.success) loadLeaves();
      } catch (err) {
        console.error(err);
      }
    }

    function formatDate(d) {
      if (!d) return '';
      return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function escapeHtml(s) {
      const div = document.createElement('div');
      div.innerText = s || '';
      return div.innerHTML;
    }

    loadLeaves();
  </script>
</body>
</html>
