<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Academic Timetable (PDF) — Student Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/student/components/core/reset.css">
  <link rel="stylesheet" href="/student/components/core/variables.css">
  <link rel="stylesheet" href="/student/components/student-base.css">
  <link rel="stylesheet" href="/student/components/header/header.css">
  <link rel="stylesheet" href="/student/components/sidebar/sidebar.css">
  <link rel="stylesheet" href="/student/timetable/timetable.css?v=20261116_v2">
</head>
<body class="page-layout">
  <div id="student-header-mount"></div>
  <div id="student-sidebar-mount"></div>
  <div id="user-nav" style="display:none;" aria-hidden="true"></div>

  <main class="student-tt-container">
    <!-- Page Header -->
    <div class="tt-page-header">
      <div class="tt-header-left">
        <div class="tt-header-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="tt-page-title">Academic Timetable</h1>
          <p class="tt-page-subtitle" id="tt-cohort-subtitle">Official departmental schedule & lecture routine in PDF format.</p>
        </div>
      </div>
      <div>
        <a href="/student/dashboard/index.html" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
      </div>
    </div>

    <!-- Year Filter Pill Bar -->
    <nav class="tt-year-nav" id="tt-year-nav" aria-label="Filter Timetable by Year">
      <button type="button" class="tt-year-pill active" data-year="MY" onclick="switchYearFilter('MY')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span id="label-my-year">My Year Timetable</span>
      </button>
      <button type="button" class="tt-year-pill" data-year="ALL" onclick="switchYearFilter('ALL')">
        <span>All Department Timetables</span>
      </button>
      <button type="button" class="tt-year-pill" data-year="1" onclick="switchYearFilter(1)">1st Year</button>
      <button type="button" class="tt-year-pill" data-year="2" onclick="switchYearFilter(2)">2nd Year</button>
      <button type="button" class="tt-year-pill" data-year="3" onclick="switchYearFilter(3)">3rd Year</button>
      <button type="button" class="tt-year-pill" data-year="4" onclick="switchYearFilter(4)">4th Year</button>
    </nav>

    <!-- Main Container Mount -->
    <div id="tt-content-mount">
      <div class="tt-empty-state">
        <div class="tt-empty-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 14 14"></polyline>
          </svg>
        </div>
        <h3 class="tt-empty-title">Loading Academic Timetable...</h3>
        <p class="tt-empty-desc">Fetching official PDF routine from the department.</p>
      </div>
    </div>
  </main>

  <!-- Fullscreen Preview Modal -->
  <div class="tt-modal-backdrop" id="tt-preview-modal" onclick="if(event.target===this)closePreviewModal()">
    <div class="tt-modal-dialog">
      <div class="tt-modal-header">
        <h3 class="tt-modal-title" id="tt-modal-title">Timetable Preview</h3>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <a id="tt-modal-download-btn" href="#" download class="btn btn-secondary btn-sm" target="_blank">Download PDF</a>
          <button type="button" class="btn btn-secondary btn-sm" onclick="closePreviewModal()">✕ Close</button>
        </div>
      </div>
      <div class="tt-modal-body">
        <iframe id="tt-modal-iframe" src="about:blank" style="width:100%; height:100%; border:none;"></iframe>
      </div>
    </div>
  </div>

  <script src="/student/components/core/api.js"></script>
  <script src="/student/components/core/auth.js"></script>
  <script src="/student/components/core/utils.js"></script>
  <script src="/student/components/icons.js"></script>
  <script src="/student/components/student-ui.js"></script>
  <script src="/student/components/header/header.js"></script>
  <script src="/student/components/sidebar/sidebar.js"></script>
  <script src="/student/timetable/timetable.js?v=20261116_v2"></script>
</body>
</html>
