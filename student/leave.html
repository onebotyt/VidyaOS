<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for Leave — Student Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    form.add-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; margin-top: 0.75rem; }
    form.add-form label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); display:block; margin-bottom: 0.25rem; }
    form.add-form input, form.add-form textarea {
      width: 100%; padding: 0.5rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-family: inherit;
    }
    .full-row { grid-column: 1 / -1; }
    .leave-card { border: 1px solid var(--border-color); border-radius: var(--radius-lg); background: var(--bg-card); padding: 1rem 1.2rem; margin-bottom: 0.8rem; }
    .leave-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }
    .status-pill { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; padding: 0.2rem 0.6rem; border-radius: 999px; }
    .status-pill.PENDING { background: var(--status-pending-bg); color: var(--status-pending); }
    .status-pill.APPROVED { background: var(--status-present-bg); color: var(--status-present); }
    .status-pill.REJECTED { background: var(--status-absent-bg); color: var(--status-absent); }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="/student/dashboard.html" class="brand">
      <span class="brand-badge" style="background: var(--color-primary);">STUDENT</span>
      <span>Leave</span>
    </a>
    <div id="user-nav" class="user-nav"></div>
  </header>

  <main class="container" style="padding-top: 2rem; padding-bottom: 3rem; max-width: 800px;">
    <div class="page-header">
      <div>
        <h1 class="page-title">Apply for Leave</h1>
        <p class="page-subtitle">Tell your teacher when you'll be away and why.</p>
      </div>
      <a href="/student/dashboard.html" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
    </div>

    <div class="card" style="margin-bottom: 1.5rem;">
      <form class="add-form" onsubmit="applyLeave(event)">
        <div><label>From</label><input type="date" id="f-from" required></div>
        <div><label>To</label><input type="date" id="f-to" required></div>
        <div class="full-row"><label>Reason</label><textarea id="f-reason" rows="2" placeholder="e.g. Family function" required></textarea></div>
        <div class="full-row"><button class="btn btn-primary" type="submit">🧾 Submit Application</button></div>
      </form>
    </div>

    <h3 style="font-size:1rem; font-weight:700; margin-bottom:0.75rem;">My Applications</h3>
    <div id="leave-list">Loading...</div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js?v=2.2"></script>
  <script>
    guardRoute(['STUDENT']);

    async function applyLeave(e) {
      e.preventDefault();
      const res = await fetchApi('/leave', {
        method: 'POST',
        body: JSON.stringify({
          from_date: document.getElementById('f-from').value,
          to_date: document.getElementById('f-to').value,
          reason: document.getElementById('f-reason').value
        })
      });
      if (res.success) {
        showToast('Leave application submitted!', 'success');
        document.getElementById('f-reason').value = '';
        loadLeaves();
      } else {
        showToast(res.error?.message || 'Could not submit', 'error');
      }
    }

    async function loadLeaves() {
      const res = await fetchApi('/leave/my');
      const list = document.getElementById('leave-list');
      if (!res.success || !res.data.length) {
        list.innerHTML = `<div class="card" style="text-align:center; padding:2rem; color:var(--text-muted);">No leave applications yet.</div>`;
        return;
      }
      list.innerHTML = res.data.map(l => `
        <div class="leave-card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>${formatDate(l.from_date)} → ${formatDate(l.to_date)}</strong>
            <span class="status-pill ${l.status}">${l.status}</span>
          </div>
          <div class="leave-meta">${escapeHtml(l.reason)}</div>
          ${l.review_note ? `<div class="leave-meta">Teacher's note: ${escapeHtml(l.review_note)}</div>` : ''}
        </div>
      `).join('');
    }

    function formatDate(d) { return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }
    function escapeHtml(s) { const div = document.createElement('div'); div.innerText = s || ''; return div.innerHTML; }

    loadLeaves();
  </script>
</body>
</html>
