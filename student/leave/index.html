<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Apply for Leave — Student Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css?v=20261028">
  <link rel="stylesheet" href="/css/variables.css?v=20261028">
  <link rel="stylesheet" href="/student/components/student-base.css">
  <link rel="stylesheet" href="/student/components/header/header.css">
  <link rel="stylesheet" href="/student/components/sidebar/sidebar.css">
  
  <link rel="stylesheet" href="/student/leave/leave.css?v=20261028">
</head>
<body class="page-layout">
  <!-- Semantic Mount Anchors for Isolated Student Components -->
  <div id="student-header-mount"></div>
  <div id="student-sidebar-mount"></div>

  <!-- Compatibility marker for user-nav -->
  <div id="user-nav" style="display:none;" aria-hidden="true"></div>

  <main class="container" style="padding-top: 2rem; padding-bottom: 3rem; max-width: 800px;">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.5rem;">
      <div>
        <h1 class="page-title">Apply for Leave</h1>
        <p class="page-subtitle">Tell your teacher when you'll be away and why.</p>
      </div>
      <a href="/student/dashboard.html" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
    </div>

    <div class="card" style="margin-bottom: 1.5rem;">
      <form class="add-form" onsubmit="applyLeave(event)">
        <div><label>From</label><input type="date" id="f-from" required></div>
        <div><label>To</label><input type="date" id="f-to" required></div>
        <div class="full-row"><label>Reason</label><textarea id="f-reason" rows="2" placeholder="e.g. Family function" required></textarea></div>
        <div class="full-row"><button class="btn btn-primary" type="submit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg> Submit Application</button></div>
      </form>
    </div>

    <h3 style="font-size:1rem; font-weight:700; margin-bottom:0.75rem;">My Applications</h3>
    <div id="leave-list">Loading...</div>
  </main>

  <!-- Shared Security & API Core -->
  <script src="/js/api.js?v=20261028"></script>
  <script src="/js/auth.js?v=20261028"></script>
  <script src="/js/utils.js"></script>

  <!-- Dedicated Student Component Suite -->
  <script src="/student/components/icons.js"></script>
  <script src="/student/components/student-ui.js"></script>
  <script src="/student/components/header/header.js"></script>
  <script src="/student/components/sidebar/sidebar.js"></script>
  
  <!-- Scoped Page Script -->
  <script src="/student/leave/leave.js?v=20261028"></script>
</body>
</html>
