<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>To-do — Student Portal | VidyaOS Classroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/student/components/core/reset.css">
  <link rel="stylesheet" href="/student/components/core/variables.css">
  <link rel="stylesheet" href="/student/components/student-base.css">
  <link rel="stylesheet" href="/student/components/header/header.css">
  <link rel="stylesheet" href="/student/components/sidebar/sidebar.css">
  <link rel="stylesheet" href="/student/assignments/assignments.css?v=20261028">
</head>
<body class="classroom-page">

  <!-- Semantic Mount Anchors for Isolated Student Components -->
  <div id="student-header-mount"></div>
  <div id="student-sidebar-mount"></div>

  <!-- Compatibility marker for legacy script queries -->
  <div id="user-nav" style="display:none;" aria-hidden="true"></div>

  <!-- ═══════════════════════════════════════════════════════════
       MAIN TO-DO HUB WORKSPACE
       ═══════════════════════════════════════════════════════════ -->
  <main class="todo-container">

    <!-- Hero Header with Class Filter Dropdown -->
    <section class="todo-hero-bar">
      <div class="todo-hero-left">
        <h1>
          <span>To-do</span>
        </h1>
        <p>Review upcoming coursework, missing assignments, and turned-in grades across your classes.</p>
      </div>

      <div class="todo-filter-wrap">
        <label for="todo-class-filter" style="font-size:0.82rem; font-weight:600; color:var(--text-muted);">Class:</label>
        <select id="todo-class-filter" class="todo-class-select" onchange="handleClassFilterChange(this.value)">
          <option value="ALL">All classes</option>
        </select>
      </div>
    </section>

    <!-- Material Design Tabs Nav -->
    <nav class="todo-tabs-nav" id="todo-tabs-nav">
      <button type="button" class="todo-tab-btn active" id="tab-btn-assigned" onclick="switchTodoTab('assigned')">
        <span>Assigned</span>
        <span class="todo-tab-badge" id="badge-assigned">0</span>
      </button>

      <button type="button" class="todo-tab-btn" id="tab-btn-missing" onclick="switchTodoTab('missing')">
        <span>Missing</span>
        <span class="todo-tab-badge" id="badge-missing">0</span>
      </button>

      <button type="button" class="todo-tab-btn" id="tab-btn-done" onclick="switchTodoTab('done')">
        <span>Done</span>
        <span class="todo-tab-badge" id="badge-done">0</span>
      </button>
    </nav>

    <!-- Tab Pane 1: Assigned -->
    <section class="todo-tab-pane active" id="tab-pane-assigned">
      <div id="todo-list-assigned">
        <div class="todo-empty-state">
          <div class="todo-empty-icon">⏳</div>
          <div class="todo-empty-title">Loading assigned coursework...</div>
        </div>
      </div>
    </section>

    <!-- Tab Pane 2: Missing -->
    <section class="todo-tab-pane" id="tab-pane-missing">
      <div id="todo-list-missing">
        <div class="todo-empty-state">
          <div class="todo-empty-icon">⏳</div>
          <div class="todo-empty-title">Loading missing work...</div>
        </div>
      </div>
    </section>

    <!-- Tab Pane 3: Done -->
    <section class="todo-tab-pane" id="tab-pane-done">
      <div id="todo-list-done">
        <div class="todo-empty-state">
          <div class="todo-empty-icon" data-icon="clock"></div>
          <div class="todo-empty-title">Loading completed work...</div>
        </div>
      </div>
    </section>

  </main>

  <!-- Shared Security & API Core -->
  <script src="/student/components/core/api.js"></script>
  <script src="/student/components/core/auth.js"></script>
  <script src="/student/components/core/utils.js"></script>

  <!-- Dedicated Student Component Suite -->
  <script src="/student/components/icons.js"></script>
  <script src="/student/components/student-ui.js"></script>
  <script src="/student/components/header/header.js"></script>
  <script src="/student/components/sidebar/sidebar.js"></script>

  <!-- Scoped Page Script -->
  <script src="/student/assignments/assignments.js?v=20261028"></script>
</body>
</html>
