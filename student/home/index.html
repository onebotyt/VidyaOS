<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Student Home — VidyaOS</title>
  <script src="/mobile-bridge.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/student/components/core/reset.css">
  <link rel="stylesheet" href="/student/components/core/variables.css">
  <link rel="stylesheet" href="/student/components/student-base.css">
  <link rel="stylesheet" href="/student/components/header/header.css">
  <link rel="stylesheet" href="/student/components/sidebar/sidebar.css">
  <link rel="stylesheet" href="/global-components/institution-hero/institution-hero.css">
  <link rel="stylesheet" href="/student/home/home.css?v=20261121">
</head>
<body class="student-home-page">
  <!-- Semantic Mount Anchors for Isolated Student Components -->
  <div id="student-header-mount"></div>
  <div id="student-sidebar-mount"></div>

  <!-- Compatibility marker for user-nav & active-session checks -->
  <div id="user-nav" style="display:none;" aria-hidden="true"></div>

  <main class="container home-main-container">
    <!-- 1. GLOBAL REUSABLE INSTITUTION SHOWCASE HERO -->
    <div id="global-hero-mount"></div>

    <!-- 2. "UP NEXT" TODAY'S SCHEDULE HIGHLIGHT -->
    <section class="home-up-next-card" id="home-up-next-card">
      <div class="up-next-header">
        <div class="up-next-tag">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span id="up-next-status-label">UP NEXT TODAY</span>
        </div>
        <a href="/student/timetable/index.html" class="up-next-view-link">
          <span>Full Routine</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
      </div>
      <div class="up-next-body">
        <div class="up-next-info">
          <h2 class="up-next-subject" id="next-class-subject">Loading schedule…</h2>
          <div class="up-next-meta">
            <span id="next-class-time" class="time-slot">--:--</span>
            <span class="bullet-sep">•</span>
            <span id="next-class-room">Classroom</span>
            <span class="bullet-sep">•</span>
            <span id="next-class-faculty" class="teacher-name">Faculty</span>
          </div>
        </div>
        <a href="/student/attendance/index.html" class="btn btn-sm btn-primary btn-checkin-action" id="btn-home-checkin">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          <span>Attendance</span>
        </a>
      </div>
    </section>

    <!-- 3. QUICK ACTION DOCK (4 ICON TILES) -->
    <section class="home-quick-actions">
      <a href="/student/attendance/index.html" class="quick-tile">
        <div class="tile-icon-wrap icon-att">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><polyline points="9 15 11 17 15 13"></polyline></svg>
        </div>
        <span class="tile-label">Attendance</span>
      </a>

      <a href="/student/timetable/index.html" class="quick-tile">
        <div class="tile-icon-wrap icon-routine">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
        <span class="tile-label">Routine</span>
      </a>

      <a href="/student/assignments/index.html" class="quick-tile">
        <div class="tile-icon-wrap icon-tasks">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M9 12h6"></path><path d="M9 16h6"></path></svg>
        </div>
        <span class="tile-label">Classwork</span>
      </a>

      <a href="/student/leave/index.html" class="quick-tile">
        <div class="tile-icon-wrap icon-leave">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2 11 13"></path><path d="m22 2-7 20-4-9-9-4 20-7z"></path></svg>
        </div>
        <span class="tile-label">Leave</span>
      </a>
    </section>

    <!-- 4. PENDING CLASSWORK & DEADLINES -->
    <div class="home-cockpit-grid">
      <section class="card home-card-tasks">
        <div class="card-header-clean">
          <div class="header-title-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-warning, #f59e0b)" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
            <h3>Upcoming Deadlines</h3>
          </div>
          <a href="/student/assignments/index.html" class="link-subtle">View All &rarr;</a>
        </div>

        <div class="home-tasks-container" id="home-tasks-list">
          <div class="task-loading-placeholder">
            <span>Checking active coursework…</span>
          </div>
        </div>
      </section>
    </div>

    <!-- 5. MY ENROLLED CLASSES (FAST CAROUSEL / GRID) -->
    <section class="home-classes-section">
      <div class="section-title-row">
        <div class="title-with-badge">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"></rect><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"></rect><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"></rect></svg>
          <h2>My Enrolled Classes</h2>
          <span class="count-bubble" id="home-classes-count">--</span>
        </div>
        <a href="/student/dashboard/index.html" class="explore-all-btn">
          <span>Classes Hub</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
      </div>

      <div class="classes-slider-wrap" id="home-classes-container">
        <!-- Injected dynamically via home.js -->
        <div class="class-card-placeholder">Loading enrolled subjects…</div>
      </div>
    </section>
  </main>

  <!-- Shared Security & API Core -->
  <script src="/student/components/core/api.js"></script>
  <script src="/student/components/core/auth.js"></script>
  <script src="/student/components/core/utils.js"></script>

  <!-- Dedicated Student Component Suite -->
  <script src="/student/components/icons.js"></script>
  <script src="/student/components/student-ui.js"></script>
  <script src="/shared/js/classroom-themes.js"></script>
  <script src="/student/components/header/header.js"></script>
  <script src="/student/components/sidebar/sidebar.js"></script>
  <script src="/global-components/institution-hero/institution-hero.js"></script>

  <!-- Scoped Page Script -->
  <script src="/student/home/home.js?v=20261121"></script>
</body>
</html>
