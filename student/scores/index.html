<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>My Test Scores — Student Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css?v=20261028">
  <link rel="stylesheet" href="/css/variables.css?v=20261028">
  <link rel="stylesheet" href="/student/components/student-base.css">
  <link rel="stylesheet" href="/student/components/header/header.css">
  <link rel="stylesheet" href="/student/components/sidebar/sidebar.css">
  
  <link rel="stylesheet" href="/student/scores/scores.css?v=20261028">
</head>
<body class="page-layout">
  <!-- Semantic Mount Anchors for Isolated Student Components -->
  <div id="student-header-mount"></div>
  <div id="student-sidebar-mount"></div>

  <!-- Compatibility marker for user-nav -->
  <div id="user-nav" style="display:none;" aria-hidden="true"></div>

  <main class="container" style="padding-top: 2rem; padding-bottom: 3.5rem; max-width: 960px;">
    <!-- Student Identity Card -->
    <div id="student-id-card" class="card" style="display: none; margin-bottom: 1.5rem; border-left: 4px solid var(--color-primary); background: var(--bg-card);">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
          <div style="display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.25rem;">
            <h2 id="scores-student-name" style="font-size: 1.15rem; font-weight: 800; margin: 0; color: var(--text-main);">Student Name</h2>
            <span id="scores-cohort-badge" class="badge badge-pending">Cohort</span>
          </div>
          <div id="scores-dept-info" style="font-size: 0.825rem; color: var(--text-muted);">Department / Course</div>
        </div>
        <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
          <span class="badge badge-present" style="font-size: 0.82rem; padding: 0.35rem 0.75rem;">
            Roll: <strong id="scores-roll-no">—</strong>
          </span>
          <span class="badge" style="background: var(--bg-surface-secondary); font-family: var(--font-family-mono); font-size: 0.82rem; color: var(--color-primary); font-weight: 700; padding: 0.35rem 0.75rem;">
            UBTER Reg: <strong id="scores-reg-no">—</strong>
          </span>
          <span class="badge" style="background: var(--bg-surface-secondary); font-family: var(--font-family-mono); font-size: 0.82rem; color: var(--text-muted); padding: 0.35rem 0.75rem;">
            <span id="scores-enrollment-no">—</span>
          </span>
        </div>
      </div>
    </div>

    <!-- Page Header -->
    <div class="page-header" style="margin-bottom: 1.25rem;">
      <div>
        <h1 class="page-title">My Test Scores &amp; Internal Evaluation</h1>
        <p class="page-subtitle">Recorded unit tests, class assessments, and coursework evaluations</p>
      </div>
      <a href="/student/dashboard.html" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
    </div>

    <div id="scores-wrap">
      <div class="card" style="text-align: center; padding: 2rem; color: var(--text-muted);">
        Loading your test scores...
      </div>
    </div>
  </main>

  <!-- Shared Security & API Core -->
  <script src="/js/api.js?v=20261028"></script>
  <script src="/js/auth.js?v=20261028"></script>
  <script src="/js/utils.js"></script>

  <!-- Dedicated Student Component Suite -->
  <script src="/student/components/icons.js"></script>
  <script src="/student/components/student-ui.js"></script>
  <script src="/student/components/header/header.js"></script>
  <script src="/student/components/sidebar/sidebar.js"></script>
  
  <!-- Scoped Page Script -->
  <script src="/student/scores/scores.js?v=20261028"></script>
</body>
</html>
