     frontend/components/modal/modal.html
══════════════════════════════════════════════════════════════ -->
<div id="app-modal-template" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-header">
      <h3 class="modal-title" id="app-modal-title">Modal Title</h3>
    </div>
    <div class="modal-body" id="app-modal-body">
      <!-- Modal Content Injected Here -->
    </div>
    <div class="modal-footer" id="app-modal-footer">
      <button type="button" class="btn btn-secondary modal-cancel-btn" onclick="closeModal(this.closest('.modal-backdrop'))">Cancel</button>
      <button type="button" class="btn btn-primary modal-confirm-btn" id="app-modal-confirm">Confirm</button>
    </div>
  </div>
</div>
