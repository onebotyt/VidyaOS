<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Mountain Peaks of Uttarakhand -->
  <path d="M45,130 L75,85 L105,125 L125,95 L155,135 Z" fill="#3b82f6" opacity="0.35"/>
  <path d="M60,135 L90,95 L115,130 L135,105 L160,140 Z" fill="#60a5fa" opacity="0.45"/>

  <!-- Rising Sun of Knowledge -->
  <circle cx="100" cy="80" r="18" fill="url(#goldGrad)"/>
  <g stroke="url(#goldGrad)" stroke-width="2">
    <line x1="100" y1="52" x2="100" y2="58"/>
    <line x1="100" y1="102" x2="100" y2="108"/>
    <line x1="72" y1="80" x2="78" y2="80"/>
    <line x1="122" y1="80" x2="128" y2="80"/>
    <line x1="80" y1="60" x2="85" y2="65"/>
    <line x1="120" y1="60" x2="115" y2="65"/>
    <line x1="80" y1="100" x2="85" y2="95"/>
    <line x1="120" y1="100" x2="115" y2="95"/>
  </g>

  <!-- Technical Cogwheel / Polytechnic Gear -->
  <g fill="url(#goldGrad)" transform="translate(100, 115) scale(0.65)">
    <circle cx="0" cy="0" r="28" fill="#1e3a8a" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="0" cy="0" r="12" fill="url(#goldGrad)"/>
  </g>

  <!-- Open Book of Learning -->
  <path d="M70,145 Q100,138 100,150 Q100,138 130,145 L130,165 Q100,158 100,170 Q100,158 70,165 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="100" y1="150" x2="100" y2="170" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Torch of Wisdom -->
  <path d="M96,55 Q100,42 104,55 Q100,50 96,55 Z" fill="#ef4444"/>
  <path d="M98,55 Q100,46 102,55 Z" fill="#fbbf24"/>

  <!-- Institution Monogram / Seal Inscription -->
  <text x="100" y="32" font-family="Inter, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">GOVT. POLYTECHNIC</text>
  <text x="100" y="185" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#f59e0b" text-anchor="middle" letter-spacing="2">NAINITAL</text>
  <circle cx="45" cy="100" r="2.5" fill="#f59e0b"/>
  <circle cx="155" cy="100" r="2.5" fill="#f59e0b"/>
</svg>
