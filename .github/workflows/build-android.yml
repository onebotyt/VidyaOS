name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'app-version.json'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Auto-Increment App Version
        id: versioning
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION="1.0.${BUILD_NUM}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_ENV

          # 1. Update app-version.json for In-App OTA Updates
          cat <<EOF > app-version.json
          {
            "version": "${VERSION}",
            "buildNumber": ${BUILD_NUM},
            "releaseDate": "$(date -u +'%Y-%m-%d')",
            "appName": "VidyaOS",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/VidyaOS.apk",
            "releaseNotes": "Automated build ${VERSION} with instant cloud sync and mobile attendance studio."
          }
          EOF

          # 2. Update package.json version
          node -e "const pkg = require('./package.json'); pkg.version = '${VERSION}'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

          # 3. Update Android Gradle versionCode and versionName
          node -e "const fs = require('fs'); let g = fs.readFileSync('android/app/build.gradle', 'utf8'); g = g.replace(/versionCode \d+/, 'versionCode ' + process.env.BUILD_NUM).replace(/versionName \".*?\"/, 'versionName \"' + process.env.VERSION + '\"'); fs.writeFileSync('android/app/build.gradle', g);"

      - name: Install Node Dependencies
        run: npm install

      - name: Prepare Mobile Web Assets
        run: node scripts/prepare-mobile.js

      - name: Sync Capacitor Android Project
        run: |
          chmod +x android/gradlew
          npx cap sync android

      - name: Build Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy Release APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./VidyaOS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidyaOS-Android-APK
          path: ./VidyaOS.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "VidyaOS Mobile App ${{ env.TAG_NAME }}"
          body: |
            ## 📱 VidyaOS Android APK Release (${{ env.TAG_NAME }})

            Direct download link for Android:
            - **[Download VidyaOS.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/VidyaOS.apk)**

            ### Features:
            - **Auto-Version**: Version code `${{ env.BUILD_NUM }}`, version name `${{ env.VERSION }}`.
            - Complete institutional campus OS frontend wrapped natively with Capacitor.
            - Real-time cloud sync with VidyaOS backend on Render.
            - Mobile-optimized attendance studio with Camera QR scanner & PIN entry.
            - Native Android back button navigation.
            - In-app automatic update notification for already installed devices.
          files: |
            ./VidyaOS.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Auto-Incremented Version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-version.json package.json android/app/build.gradle
          git commit -m "chore(release): auto-bump version to v${{ env.VERSION }} [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
