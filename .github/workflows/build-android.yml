name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'app-version.json'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Auto-Increment App Version
        id: versioning
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION="1.0.${BUILD_NUM}"
          export BUILD_NUM VERSION
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_ENV
          node scripts/bump-version.js "${BUILD_NUM}"

      - name: Install Node Dependencies
        run: npm install

      - name: Prepare Mobile Web Assets
        run: node scripts/prepare-mobile.js

      - name: Sync Capacitor Android Project
        run: |
          chmod +x android/gradlew
          npx cap sync android

      - name: Ensure Persistent Release Keystore
        run: |
          KEYSTORE_FILE="android/app/vidyaos.keystore"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "[Keystore] Generating persistent signing key for seamless updates..."
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" \
              -alias vidyaos -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "vidyaos@2026" -keypass "vidyaos@2026" \
              -dname "CN=VidyaOS, OU=Engineering, O=VidyaOS, L=Nainital, ST=Uttarakhand, C=IN"
          fi

      - name: Build Android Stable APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build Native React Native v2app (Expo Prebuild & Gradle)
        run: |
          echo "[v2app] Starting Native React Native APK Build from frontendv2..."
          cd frontendv2
          # Ensure hoisted layout for React Native Gradle Plugin resolution
          pnpm install --no-frozen-lockfile
          cd apps/mobile
          npx expo prebuild --platform android --no-install
          if [ -d "android" ]; then
            echo "[v2app] Prebuild succeeded. Patching settings.gradle for monorepo Gradle plugin resolution..."
            node -e "
              const fs = require('fs');
              const path = require('path');
              const settingsPath = path.resolve('android/settings.gradle');
              if (fs.existsSync(settingsPath)) {
                let content = fs.readFileSync(settingsPath, 'utf8');
                try {
                  const pluginPkg = require.resolve('@react-native/gradle-plugin/package.json');
                  const pluginDir = path.dirname(pluginPkg).replace(/\\\\/g, '/');
                  console.log('[v2app] Resolved @react-native/gradle-plugin at:', pluginDir);
                  content = content.replace(
                    /includeBuild\(new File\(.+@react-native\/gradle-plugin\/package\.json.+\)\.getParentFile\(\)\.toString\(\)\)/g,
                    'includeBuild(\"' + pluginDir + '\")'
                  );
                } catch(e) {
                  console.warn('[v2app] Warning resolving plugin:', e.message);
                }
                try {
                  const rnPkg = require.resolve('react-native/package.json').replace(/\\\\/g, '/');
                  content = content.replace(/require\.resolve\('react-native\/package\.json'\)/g, \"'\" + rnPkg + \"'\");
                } catch(e) {}
                try {
                  const expoPkg = require.resolve('expo/package.json').replace(/\\\\/g, '/');
                  content = content.replace(/require\.resolve\('expo\/package\.json'\)/g, \"'\" + expoPkg + \"'\");
                } catch(e) {}
                fs.writeFileSync(settingsPath, content, 'utf8');
                console.log('[v2app] Patched settings.gradle successfully.');
              }
            "
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              cp app/build/outputs/apk/debug/app-debug.apk ../../../../v2app.apk
              echo "[v2app] ✅ Native React Native APK compiled successfully!"
            else
              echo "[v2app] ❌ Native React Native APK build did not produce app-debug.apk"
              exit 1
            fi
            cd ../../..
          else
            echo "[v2app] ❌ Prebuild failed to create android directory"
            exit 1
          fi

      - name: Copy Release APK Artifacts
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./VidyaOS.apk
          if [ ! -f "./v2app.apk" ]; then
            echo "[v2app] ERROR: Native v2app.apk was not generated. Failing release to prevent incorrect fallback!"
            exit 1
          fi
          ls -lh ./VidyaOS.apk ./v2app.apk

      - name: Upload v2app APK Artifact (Visible in GitHub Details)
        uses: actions/upload-artifact@v4
        with:
          name: v2app-apk
          path: ./v2app.apk

      - name: Upload VidyaOS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidyaOS-Android-APK
          path: ./VidyaOS.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "VidyaOS Mobile App ${{ env.TAG_NAME }}"
          body: |
            ## 📱 VidyaOS & v2app Android APK Release (${{ env.TAG_NAME }})

            Direct download links for Android:
            - **[Download v2app.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/v2app.apk)** (Frontend v2 Universal App)
            - **[Download VidyaOS.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/VidyaOS.apk)**

            ### Features:
            - **Auto-Version**: Version code `${{ env.BUILD_NUM }}`, version name `${{ env.VERSION }}`.
            - Includes Frontend v2 multi-OS single codebase app.
            - Complete institutional campus OS frontend wrapped natively with Capacitor.
            - Real-time cloud sync with VidyaOS backend on Render.
            - Mobile-optimized attendance studio with Camera QR scanner & PIN entry.
            - Google Classroom style dynamic theme banners.
          files: |
            ./v2app.apk
            ./VidyaOS.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Auto-Incremented Version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-version.json package.json android/app/build.gradle
          if [ -f android/app/vidyaos.keystore ]; then
            git add android/app/vidyaos.keystore
          fi
          git commit -m "chore(release): auto-bump version to v${{ env.VERSION }} [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
