name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'app-version.json'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install

      - name: Prepare Mobile Web Assets
        run: node scripts/prepare-mobile.js

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        id: prep
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION="1.0.${BUILD_NUM}"
          cp android/app/build/outputs/apk/debug/app-debug.apk ./VidyaOS.apk
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidyaOS-Android-APK
          path: ./VidyaOS.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "VidyaOS Mobile App ${{ env.TAG_NAME }}"
          body: |
            ## 📱 VidyaOS Android APK Release (${{ env.TAG_NAME }})

            Direct download link for Android:
            - **[Download VidyaOS.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/VidyaOS.apk)**

            ### Features:
            - Complete institutional campus OS frontend wrapped natively with Capacitor.
            - Real-time cloud sync with VidyaOS backend.
            - Mobile-optimized attendance studio with Camera QR scanner & PIN entry.
            - Native Android back button navigation.
            - In-app automatic update notification for already installed devices.
          files: |
            ./VidyaOS.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README.md and app-version.json
        run: |
          VERSION="${{ env.VERSION }}"
          APK_DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/latest/download/VidyaOS.apk"
          
          # Update app-version.json for In-App Updates
          cat <<EOF > app-version.json
          {
            "version": "${VERSION}",
            "buildNumber": ${{ github.run_number }},
            "releaseDate": "$(date -u +'%Y-%m-%d')",
            "appName": "VidyaOS",
            "apkUrl": "${APK_DOWNLOAD_URL}",
            "releaseNotes": "Automated build ${VERSION} with latest campus OS improvements."
          }
          EOF

          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add and commit version tracking file and readme if changed
          git add app-version.json README.md
          git commit -m "chore(release): bump app version to v${VERSION} and refresh APK download link [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
