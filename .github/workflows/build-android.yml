name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'app-version.json'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Auto-Increment App Version
        id: versioning
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION="1.0.${BUILD_NUM}"
          export BUILD_NUM VERSION
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_ENV
          node scripts/bump-version.js "${BUILD_NUM}"

      - name: Install Node Dependencies
        run: npm install

      - name: Prepare Mobile Web Assets
        run: node scripts/prepare-mobile.js

      - name: Sync Capacitor Android Project
        run: |
          chmod +x android/gradlew
          npx cap sync android

      - name: Ensure Persistent Release Keystore
        run: |
          KEYSTORE_FILE="android/app/vidyaos.keystore"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "[Keystore] Generating persistent signing key for seamless updates..."
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" \
              -alias vidyaos -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "vidyaos@2026" -keypass "vidyaos@2026" \
              -dname "CN=VidyaOS, OU=Engineering, O=VidyaOS, L=Nainital, ST=Uttarakhand, C=IN"
          fi

      - name: Build Android Stable APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build Native React Native v2app (Expo Prebuild & Gradle)
        run: |
          echo "[v2app] Starting Native React Native APK Build from frontendv2..."
          cd frontendv2
          pnpm install --no-frozen-lockfile
          # Locate single @react-native/gradle-plugin inside react-native dependencies
          PLUGIN_DIR=$(node -e "console.log(require('path').dirname(require.resolve('@react-native/gradle-plugin/package.json', { paths: [process.cwd(), process.cwd() + '/apps/mobile'] })))")
          echo "[v2app] Found single Gradle plugin at: $PLUGIN_DIR"
          # Link directly into apps/mobile/node_modules so rootDir execution in Gradle resolves identically
          mkdir -p apps/mobile/node_modules/@react-native
          ln -sf "$PLUGIN_DIR" apps/mobile/node_modules/@react-native/gradle-plugin

          cd apps/mobile
          npx expo prebuild --platform android --no-install
          if [ -d "android" ]; then
            # Configure 4GB JVM heap for Gradle daemon to ensure Jetify has enough memory without breaking CMake
            sed -i '/org.gradle.jvmargs/d' android/gradle.properties || true
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

            # Configure react block: debuggableVariants = [] forces offline bundle generation for all variants
            # Also patch AndroidManifest for cleartext traffic and MainActivity to clear FLAG_SECURE for screenshots
            node -e "
              const fs = require('fs');
              const path = require('path');
              const gradleFile = 'android/app/build.gradle';
              if (fs.existsSync(gradleFile)) {
                let content = fs.readFileSync(gradleFile, 'utf8');
                content = content.replace(/react\s*\{/, 'react {\n    debuggableVariants = []');
                fs.writeFileSync(gradleFile, content, 'utf8');
              }
              const manifestFile = 'android/app/src/main/AndroidManifest.xml';
              if (fs.existsSync(manifestFile)) {
                let manifest = fs.readFileSync(manifestFile, 'utf8');
                if (!manifest.includes('android:usesCleartextTraffic')) {
                  manifest = manifest.replace('<application', '<application android:usesCleartextTraffic=\"true\"');
                }
                if (!manifest.includes('android.permission.INTERNET')) {
                  manifest = manifest.replace('</manifest>', '  <uses-permission android:name=\"android.permission.INTERNET\" />\n  <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n</manifest>');
                }
                fs.writeFileSync(manifestFile, manifest, 'utf8');
              }
              const findFiles = (dir) => {
                let res = [];
                if (!fs.existsSync(dir)) return res;
                fs.readdirSync(dir).forEach(f => {
                  const p = path.join(dir, f);
                  if (fs.statSync(p).isDirectory()) res = res.concat(findFiles(p));
                  else if (f.startsWith('MainActivity.')) res.push(p);
                });
                return res;
              };
              findFiles('android/app/src/main/java').forEach(actFile => {
                let act = fs.readFileSync(actFile, 'utf8');
                if (!act.includes('FLAG_SECURE')) {
                  if (act.includes('fun onCreate(')) {
                    act = act.replace(/(fun onCreate\([^)]*\)\s*\{)/, '\$1\n    try { window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_SECURE) } catch (e: Exception) {}');
                  } else {
                    act = act.replace(/(class MainActivity[^{]*\{)/, '\$1\n  override fun onCreate(savedInstanceState: android.os.Bundle?) {\n    super.onCreate(null)\n    try { window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_SECURE) } catch (e: Exception) {}\n  }');
                  }
                  if (!act.includes('fun onResume(')) {
                    act = act.replace(/(class MainActivity[^{]*\{)/, '\$1\n  override fun onResume() {\n    super.onResume()\n    try { window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_SECURE) } catch (e: Exception) {}\n  }');
                  }
                  fs.writeFileSync(actFile, act, 'utf8');
                  console.log('[v2app] Patched ' + actFile + ' to allow screenshots');
                }
              });
            "

            cd android
            chmod +x gradlew
            unset _JAVA_OPTIONS
            unset JAVA_TOOL_OPTIONS
            ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
            if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
              cp app/build/outputs/apk/release/app-release.apk ../../../../v2app.apk
              echo "[v2app] ✅ Native React Native Release APK (offline bundle embedded) compiled successfully!"
            elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              cp app/build/outputs/apk/debug/app-debug.apk ../../../../v2app.apk
              echo "[v2app] ✅ Native React Native Debug APK (offline bundle embedded) compiled successfully!"
            else
              echo "[v2app] ❌ Native React Native APK build did not produce release or debug APK"
              exit 1
            fi
            cd ../../..
          else
            echo "[v2app] ❌ Prebuild failed to create android directory"
            exit 1
          fi

      - name: Copy Release APK Artifacts
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./VidyaOS.apk
          if [ ! -f "./v2app.apk" ]; then
            echo "[v2app] ERROR: Native v2app.apk was not generated. Failing release to prevent incorrect fallback!"
            exit 1
          fi
          ls -lh ./VidyaOS.apk ./v2app.apk

      - name: Upload v2app APK Artifact (Visible in GitHub Details)
        uses: actions/upload-artifact@v4
        with:
          name: v2app-apk
          path: ./v2app.apk

      - name: Upload VidyaOS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidyaOS-Android-APK
          path: ./VidyaOS.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "VidyaOS Mobile App ${{ env.TAG_NAME }}"
          body: |
            ## 📱 VidyaOS & v2app Android APK Release (${{ env.TAG_NAME }})

            Direct download links for Android:
            - **[Download v2app.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/v2app.apk)** (Frontend v2 Universal App)
            - **[Download VidyaOS.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/VidyaOS.apk)**

            ### Features:
            - **Auto-Version**: Version code `${{ env.BUILD_NUM }}`, version name `${{ env.VERSION }}`.
            - Includes Frontend v2 multi-OS single codebase app.
            - Complete institutional campus OS frontend wrapped natively with Capacitor.
            - Real-time cloud sync with VidyaOS backend on Render.
            - Mobile-optimized attendance studio with Camera QR scanner & PIN entry.
            - Google Classroom style dynamic theme banners.
          files: |
            ./v2app.apk
            ./VidyaOS.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Auto-Incremented Version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-version.json package.json android/app/build.gradle
          if [ -f android/app/vidyaos.keystore ]; then
            git add android/app/vidyaos.keystore
          fi
          git commit -m "chore(release): auto-bump version to v${{ env.VERSION }} [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
